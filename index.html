<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gondola OCR Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border: 3px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        video { width: 100%; display: block; background: #000; }
        canvas { display: none; }
        #status {
            margin-top: 15px; padding: 10px; background: #222;
            border-radius: 6px; width: 100%; max-width: 380px; text-align: center;
        }
        #log {
            margin-top: 15px; width: 100%; max-width: 380px; height: 200px;
            background: #000; color: #0f0; padding: 10px;
            font-family: monospace; overflow-y: auto; border-radius: 6px;
        }
        .highlight { color: #ffaa00; font-weight: bold; }
        .error { color: #ff5555; }
    </style>
</head>
<body>

    <h2>Cabin OCR Scanner</h2>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>
    
    <canvas id="captureCanvas"></canvas>
    <div id="status">Initializing Tesseract.js...</div>
    <div id="log"></div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        // --- CONFIGURATION ---
        const WEBHOOK_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; 
        const DEBOUNCE_MS = 300000; 
        const SCAN_INTERVAL_MS = 3000; // Increased to 3 seconds
        // ---------------------
        
        let worker;
        const recentReads = {}; 

        function logMessage(msg, type = 'normal') {
            const time = new Date().toLocaleTimeString();
            const span = document.createElement('div');
            span.innerHTML = `[${time}] ${msg}`;
            if (type === 'highlight') span.className = 'highlight';
            if (type === 'error') span.className = 'error';
            logDiv.prepend(span); 
        }

        async function init() {
            try {
                worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if(m.status === "recognizing text") {
                           statusDiv.innerText = `Scanning... ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });
                
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789',
                });

                statusDiv.innerText = "Requesting camera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;

                video.onplaying = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    logMessage("Camera active. Starting scan loop.");
                    setInterval(scanFrame, SCAN_INTERVAL_MS);
                };

            } catch (err) {
                logMessage(`Error: ${err.message}`, 'error');
            }
        }

        async function scanFrame() {
            if (video.paused || video.ended) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');

            try {
                const { data: { text } } = await worker.recognize(imageData);
                
                // Strip all spaces and line breaks from the result
                const cleanedText = text.replace(/\s+/g, '');

                // Only proceed if the result is EXACTLY 2 or 3 digits
                if (/^\d{2,3}$/.test(cleanedText)) {
                    handleDetection(cleanedText);
                } else if (cleanedText.length > 0) {
                    statusDiv.innerText = `Ignored invalid read: ${cleanedText}`;
                } else {
                    statusDiv.innerText = "Waiting for cabin...";
                }
            } catch (err) {
                console.error("OCR Error:", err);
            }
        }

        function handleDetection(cabinId) {
            const now = Date.now();

            if (recentReads[cabinId] && (now - recentReads[cabinId]) < DEBOUNCE_MS) {
                statusDiv.innerText = `Cabin ${cabinId} detected (debounced)`;
                return;
            }

            recentReads[cabinId] = now;
            logMessage(`✅ Cabin ${cabinId} Arrived!`, 'highlight');
            statusDiv.innerText = `Logged Cabin ${cabinId}`;

            // Changed Content-Type to text/plain to bypass CORS preflight blocking
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    cabin_id: cabinId,
                    timestamp: new Date().toISOString(),
                    method: "browser_ocr"
                })
            }).then(() => {
                logMessage(`Webhook success for ${cabinId}`);
            }).catch(err => {
                logMessage(`Webhook error: ${err.message}`, 'error');
            });
        }

        init();
    </script>
</body>
</html>
