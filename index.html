<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gondola OCR Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border: 3px solid #333;
            border-radius: 8px;
            overflow: hidden;
            /* Required to position the target box correctly */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video { width: 100%; display: block; background: #000; }
        
        /* The Visual Targeting Box */
        #target-box {
            position: absolute;
            width: 50%;
            height: 30%;
            border: 3px dashed #00ff00;
            box-sizing: border-box;
            z-index: 10;
            /* Dims the surrounding video so you know what is being ignored */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); 
            pointer-events: none;
        }

        canvas { display: none; }
        #status {
            margin-top: 15px; padding: 10px; background: #222;
            border-radius: 6px; width: 100%; max-width: 380px; text-align: center;
        }
        #log {
            margin-top: 15px; width: 100%; max-width: 380px; height: 180px;
            background: #000; color: #0f0; padding: 10px;
            font-family: monospace; overflow-y: auto; border-radius: 6px;
        }
        .highlight { color: #ffaa00; font-weight: bold; }
        .error { color: #ff5555; }
    </style>
</head>
<body>

    <h2>Cabin OCR Scanner</h2>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <!-- The targeting overlay -->
        <div id="target-box"></div> 
    </div>
    
    <canvas id="captureCanvas"></canvas>
    <div id="status">Initializing Tesseract.js...</div>
    <div id="log"></div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        // --- CONFIGURATION ---
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbw3cTkPeC1rqETIDWgqJhsKdWOygcKr-gSByLXqi47I6E_NCmkqZEfR9-BIHHxZnM2K7g/exec"; 
        const DEBOUNCE_MS = 300000; 
        const SCAN_INTERVAL_MS = 500;  // Sped up to catch the cabin while centered
        const REQUIRED_MATCHES = 2;    
        // ---------------------
        
        let worker;
        const recentReads = {}; 
        let pendingCabinId = null;
        let matchStreak = 0;

        function logMessage(msg, type = 'normal') {
            const time = new Date().toLocaleTimeString();
            const span = document.createElement('div');
            span.innerHTML = `[${time}] ${msg}`;
            if (type === 'highlight') span.className = 'highlight';
            if (type === 'error') span.className = 'error';
            logDiv.prepend(span); 
        }

        async function init() {
            try {
                worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if(m.status === "recognizing text") {
                           statusDiv.innerText = `Scanning... ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });
                
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789',
                });

                statusDiv.innerText = "Requesting camera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;

                video.onplaying = () => {
                    logMessage("Camera active. Starting scan loop.");
                    setInterval(scanFrame, SCAN_INTERVAL_MS);
                };

            } catch (err) {
                logMessage(`Error: ${err.message}`, 'error');
            }
        }

        async function scanFrame() {
            if (video.paused || video.ended) return;

            // Define the crop area to match the CSS target box (Center 50% width, 30% height)
            const videoW = video.videoWidth;
            const videoH = video.videoHeight;
            const cropW = videoW * 0.5;
            const cropH = videoH * 0.3;
            const cropX = (videoW - cropW) / 2;
            const cropY = (videoH - cropH) / 2;

            // Size the hidden canvas strictly to the cropped dimensions
            canvas.width = cropW;
            canvas.height = cropH;

            // Draw ONLY the cropped center of the video feed to the canvas
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            
            const imageData = canvas.toDataURL('image/jpeg');

            try {
                const { data: { text } } = await worker.recognize(imageData);
                const cleanedText = text.replace(/\s+/g, '');

                if (cleanedText.length === 0) {
                    statusDiv.innerText = pendingCabinId 
                        ? `Lost sight of ${pendingCabinId}... waiting` 
                        : "Waiting for cabin in target box...";
                    return; 
                }

                if (/^\d{1,3}$/.test(cleanedText)) {
                    const cabinNum = parseInt(cleanedText, 10);
                    
                    if (cabinNum >= 1 && cabinNum <= 111) {
                        if (pendingCabinId === cabinNum) {
                            matchStreak++;
                            statusDiv.innerText = `Confirming ${cabinNum}... (${matchStreak}/${REQUIRED_MATCHES})`;
                            
                            if (matchStreak >= REQUIRED_MATCHES) {
                                handleDetection(cabinNum);
                                pendingCabinId = null; 
                                matchStreak = 0;
                            }
                        } else {
                            pendingCabinId = cabinNum;
                            matchStreak = 1;
                            statusDiv.innerText = `Spotted ${cabinNum}, waiting to verify...`;
                        }
                    } else {
                        statusDiv.innerText = `Ignored (Out of range): ${cabinNum}`;
                        pendingCabinId = null; 
                        matchStreak = 0;
                    }
                } else {
                    statusDiv.innerText = `Ignored (Not a valid number): ${cleanedText}`;
                    pendingCabinId = null; 
                    matchStreak = 0;
                }
            } catch (err) {
                console.error("OCR Error:", err);
            }
        }

        function handleDetection(cabinId) {
            const now = Date.now();

            if (recentReads[cabinId] && (now - recentReads[cabinId]) < DEBOUNCE_MS) {
                statusDiv.innerText = `Cabin ${cabinId} detected (debounced)`;
                return;
            }

            recentReads[cabinId] = now;
            logMessage(`✅ Cabin ${cabinId} Arrived!`, 'highlight');
            statusDiv.innerText = `Logged Cabin ${cabinId}`;

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    cabin_id: cabinId,
                    timestamp: new Date().toISOString(),
                    method: "browser_ocr"
                })
            }).then(() => {
                logMessage(`Webhook success for ${cabinId}`);
            }).catch(err => {
                logMessage(`Webhook error: ${err.message}`, 'error');
            });
        }

        init();
    </script>
</body>
</html>
